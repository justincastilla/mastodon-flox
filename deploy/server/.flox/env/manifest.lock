          "bin",
          "dev"
        ]
      }
    },
    "vars": {
      "AWS_REQUEST_CHECKSUM_CALCULATION": "when_required",
      "AWS_RESPONSE_CHECKSUM_VALIDATION": "when_required",
      "DATA_DIR": "/var/lib/floxtodon",
      "DB_HOST": "/var/lib/floxtodon/run",
      "DB_NAME": "mastodon_production",
      "DB_PORT": "5432",
      "DB_USER": "mastodon",
      "MAX_THREADS": "5",
      "NODE_ENV": "production",
      "RAILS_ENV": "production",
      "REDIS_URL": "redis://127.0.0.1:6379",
      "STREAMING_CLUSTER_NUM": "1",
      "WEB_CONCURRENCY": "1"
    },
    "hook": {
      "on-activate": "  # The Mastodon checkout is two levels up from deploy/server.\n  export MASTODON_ROOT=\"$(cd \"$FLOX_ENV_PROJECT/../..\" && pwd)\"\n\n  # Gems in the env cache, production groups only.\n  # One gem directory per Ruby version: native extensions (openssl, pg, nokogiri, ...)\n  # link against the exact libruby, so a Ruby upgrade must rebuild them rather than\n  # reuse gems compiled for the old build (\"linked to incompatible libruby\").\n  FLOX_RUBY_VERSION=\"$(ruby -e 'print RUBY_VERSION')\"\n  export GEM_HOME=\"$FLOX_ENV_CACHE/bundle/$FLOX_RUBY_VERSION\"\n  export BUNDLE_PATH=\"$FLOX_ENV_CACHE/bundle/$FLOX_RUBY_VERSION\"\n  export BUNDLE_GEMFILE=\"$MASTODON_ROOT/Gemfile\"\n  export BUNDLE_DEPLOYMENT=true\n  export BUNDLE_WITHOUT=\"development:test\"\n  export PATH=\"$GEM_HOME/bin:$PATH\"\n\n  # Yarn at the exact packageManager version, via corepack.\n  export COREPACK_HOME=\"$FLOX_ENV_CACHE/corepack\"\n  export COREPACK_ENABLE_DOWNLOAD_PROMPT=0\n  mkdir -p \"$COREPACK_HOME\" \"$FLOX_ENV_CACHE/node-bin\"\n  corepack enable --install-directory \"$FLOX_ENV_CACHE/node-bin\" yarn\n  export PATH=\"$FLOX_ENV_CACHE/node-bin:$PATH\"\n\n  # Caddy keeps its certificates under DATA_DIR so they survive redeploys.\n  export XDG_DATA_HOME=\"$DATA_DIR/caddy-data\"\n  export XDG_CONFIG_HOME=\"$DATA_DIR/caddy-config\"\n\n  # Persistent state directories and one-time database cluster.\n  export PGDATA=\"$DATA_DIR/postgres\"\n  mkdir -p \"$DB_HOST\" \"$DATA_DIR/redis\" \"$XDG_DATA_HOME\" \"$XDG_CONFIG_HOME\"\n  if [ ! -d \"$PGDATA\" ]; then\n    echo \"→ initializing PostgreSQL cluster (one time)\" >&2\n    initdb -D \"$PGDATA\" --username=\"$DB_USER\" --auth-local=peer --auth-host=scram-sha-256 \\\n      --no-locale --encoding=UTF8 >/dev/null\n  fi\n\n  # Dependencies — idempotent, fast when nothing changed.\n  (cd \"$MASTODON_ROOT\" && { bundle check >/dev/null 2>&1 || bundle install --quiet; })\n  (cd \"$MASTODON_ROOT\" && { [ -d node_modules ] && [ ! yarn.lock -nt node_modules ] || yarn install --immutable; })\n"
    },
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux"
      ]
    },
    "services": {
      "caddy": {
        "command": "  exec caddy run --config \"$FLOX_ENV_PROJECT/Caddyfile\" --adapter caddyfile\n"
      },
      "postgres": {
        "command": "  exec postgres -D \"$PGDATA\" -k \"$DB_HOST\" -p \"$DB_PORT\" -c listen_addresses=\"\"\n"
      },
      "redis": {
        "command": "  exec redis-server --bind 127.0.0.1 --port 6379 --dir \"$DATA_DIR/redis\" --appendonly yes\n"
      },
      "sidekiq": {
        "command": "  cd \"$MASTODON_ROOT\"\n  until psql -h \"$DB_HOST\" -p \"$DB_PORT\" -d \"$DB_NAME\" -tAc \"SELECT 1 FROM schema_migrations LIMIT 1\" >/dev/null 2>&1; do sleep 1; done\n  until redis-cli -u \"$REDIS_URL\" ping >/dev/null 2>&1; do sleep 0.5; done\n  exec bundle exec sidekiq -c 5\n",
        "vars": {
          "DB_POOL": "5"
        }
      },
      "streaming": {
        "command": "  cd \"$MASTODON_ROOT\"\n  until psql -h \"$DB_HOST\" -p \"$DB_PORT\" -d \"$DB_NAME\" -tAc \"SELECT 1 FROM schema_migrations LIMIT 1\" >/dev/null 2>&1; do sleep 1; done\n  until redis-cli -u \"$REDIS_URL\" ping >/dev/null 2>&1; do sleep 0.5; done\n  exec node ./streaming/index.js\n",
        "vars": {
          "BIND": "127.0.0.1",
          "PORT": "4000"
        }
      },
      "web": {
        "command": "  cd \"$MASTODON_ROOT\"\n  until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\" -q; do sleep 0.5; done\n  until redis-cli -u \"$REDIS_URL\" ping >/dev/null 2>&1; do sleep 0.5; done\n  bundle exec rails db:prepare\n  exec bundle exec puma -C config/puma.rb\n",
        "vars": {
          "BIND": "127.0.0.1",
          "PORT": "3000"
        }
      }
    }
  },
