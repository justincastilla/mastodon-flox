        "pkg-path": "nodejs_24",
        "version": "24.19.0"
      },
      "openssl": {
        "pkg-path": "openssl",
        "outputs": [
          "out",
          "dev"
        ]
      },
      "pkg-config": {
        "pkg-path": "pkg-config"
      },
      "postgresql": {
        "pkg-path": "postgresql_14",
        "outputs": [
          "out",
          "lib",
          "dev"
        ]
      },
      "redis": {
        "pkg-path": "redis"
      },
      "ruby": {
        "pkg-path": "ruby_4_0",
        "version": "4.0.6"
      },
      "vips": {
        "pkg-path": "vips",
        "outputs": [
          "out",
          "bin",
          "dev"
        ]
      }
    },
    "vars": {
      "DB_HOST": "/tmp/mastodon-postgres",
      "DB_NAME": "mastodon_development",
      "DB_PORT": "5432",
      "DB_USER": "mastodon",
      "RAILS_ENV": "development",
      "REDIS_URL": "redis://localhost:6379"
    },
    "hook": {
      "on-activate": "  # --- Keep Ruby gems inside the env cache, never in the repo tree or ~/.gem ---\n  export GEM_HOME=\"$FLOX_ENV_CACHE/bundle\"\n  export BUNDLE_PATH=\"$FLOX_ENV_CACHE/bundle\"\n  export PATH=\"$GEM_HOME/bin:$PATH\"\n\n  # --- PostgreSQL cluster under the cache; socket dir is $DB_HOST ---\n  export PGDATA=\"$FLOX_ENV_CACHE/postgres\"\n  mkdir -p \"$DB_HOST\"\n  if [ ! -d \"$PGDATA\" ]; then\n    echo \"→ initializing PostgreSQL cluster (one time)\" >&2\n    initdb -D \"$PGDATA\" --username=\"$DB_USER\" --auth=trust --no-locale --encoding=UTF8 >/dev/null\n  fi\n\n  # --- Redis state under the cache ---\n  mkdir -p \"$FLOX_ENV_CACHE/redis\"\n\n  # --- macOS: SIP strips DYLD_* from anything launched through /usr/bin/env (bin/rails, bin/dev) ---\n  # ruby-vips loads libvips via ffi at runtime; ffi's macOS fallback search honors LD_LIBRARY_PATH,\n  # which SIP leaves alone. (2026-09-14: without this, `bin/rails db:setup` failed with\n  # \"Could not open library 'vips.42'\" while `bundle exec rails db:setup` worked.)\n  case \"$(uname -s)\" in\n    Darwin) export LD_LIBRARY_PATH=\"$FLOX_ENV/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\" ;;\n  esac\n\n  # --- Ruby deps (Gemfile) — idempotent ---\n  bundle check >/dev/null 2>&1 || bundle install\n\n  # --- Yarn: exact packageManager version (yarn@4.18.0) via corepack, kept in the env cache ---\n  export COREPACK_HOME=\"$FLOX_ENV_CACHE/corepack\"\n  mkdir -p \"$COREPACK_HOME\" \"$FLOX_ENV_CACHE/node-bin\"\n  corepack enable --install-directory \"$FLOX_ENV_CACHE/node-bin\" yarn\n  export PATH=\"$FLOX_ENV_CACHE/node-bin:$PATH\"\n\n  # --- Node deps: yarn workspaces cover the root app + streaming/ ---\n  if [ ! -d node_modules ] || [ yarn.lock -nt node_modules ]; then\n    yarn install --immutable\n  fi\n\n  echo \"Ready. 'flox services start' (or 'flox activate -s') brings up postgres, redis, web, sidekiq, streaming and vite.\" >&2\n  echo \"First run only: 'bin/rails db:setup' before starting the app services.\" >&2\n"
    },
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux",
        "aarch64-darwin"
      ]
    },
    "services": {
      "postgres": {
        "command": "  exec postgres -D \"$FLOX_ENV_CACHE/postgres\" -k \"$DB_HOST\" -p \"$DB_PORT\" -c listen_addresses=\"\"\n"
      },
      "redis": {
        "command": "  exec redis-server --port 6379 --unixsocket /tmp/mastodon-redis.sock --dir \"$FLOX_ENV_CACHE/redis\" --save \"\" --appendonly no\n"
      },
      "sidekiq": {
        "command": "  exec bundle exec sidekiq\n"
      },
      "streaming": {
        "command": "  exec yarn workspace @mastodon/streaming start\n",
        "vars": {
          "PORT": "4000"
        }
      },
      "vite": {
        "command": "  exec yarn dev\n"
      },
      "web": {
        "command": "  exec bundle exec puma -C config/puma.rb\n",
        "vars": {
          "PORT": "3000"
        }
      }
    }
  },
