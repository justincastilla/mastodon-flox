schema-version = "1.14.0"
# Generated by /floxify
#
# Mastodon v4.7.1 is a dual-runtime app: a Rails 8.1 monolith (Ruby) plus a
# Node streaming service under streaming/. Both read the same DB_* / REDIS_URL
# env vars (config/database.yml, streaming/database.js, streaming/redis.js),
# so one [vars] block wires both. PostgreSQL and Redis are hard runtime deps.

[install]
# --- Language runtimes ---
ruby.pkg-path = "ruby_4_0" # .ruby-version 4.0.6 · Gemfile.lock RUBY VERSION 4.0.6 · Dockerfile RUBY_VERSION=4.0.6
ruby.version = "4.0.6" # exact match in catalog (Gemfile allows >= 3.3.0, < 4.1.0)
nodejs.pkg-path = "nodejs_24" # .nvmrc 24.19 · Dockerfile NODE_MAJOR_VERSION=24 · package.json engines.node ">=22"
nodejs.version = "24.19.0" # exact match to .nvmrc 24.19

# --- Package managers ---
# yarn: package.json pins packageManager "yarn@4.18.1". Catalog yarn-berry tops out at 4.14.1 and
# 2026-09-14 `yarn install` with 4.14.1 failed on yarn.lock's builtin typescript@7.0.2 patch
# (ENOENT lstat node_modules/typescript/lib/_tsc.js) — a lockfile written by a newer Yarn.
# No .yarn/releases/ is vendored, so the exact version is provisioned via corepack (bundled
# with nodejs_24) into $FLOX_ENV_CACHE on first activate — see [hook].
# bundler ships with ruby_4_0 (Gemfile.lock BUNDLED WITH 4.0.18 — bundler self-upgrades into GEM_HOME if needed)

# --- Datastores (both hard runtime deps; wired as [services.*] below) ---
postgresql.pkg-path = "postgresql_14" # docker-compose.yml db image postgres:14-alpine · also builds the pg gem (Gemfile pg ~> 1.5)
postgresql.outputs = [
  "out",
  "lib",
  "dev",
] # default is out+man only; pg gem needs pg_config (out) + libpq (lib) + headers (dev)
redis.pkg-path = "redis" # docker-compose.yml redis image redis:7-alpine
# redis.version pin dropped 2026-09-14: with `redis.version = "7.2.7"`, `flox activate` failed
# ("constraints for group 'toplevel' are too tight"); catalog default is 8.x, compose pins redis:7.
# Known discrepancy: dev runs Redis 8, production/compose runs 7. Mastodon needs >= 7.0 and Redis 8
# is backward compatible with 7.x commands, so this is fine for development — see README "Developing with Flox".

# --- Native media libraries (runtime + gem C-extensions) ---
vips.pkg-path = "vips" # Gemfile ruby-vips ~> 2.2 · Dockerfile VIPS_VERSION=8.18.5 (catalog 8.18.6 newest; group resolved 8.18.5)
vips.outputs = [
  "out",
  "bin",
  "dev",
] # default is bin+man only; libvips shared lib lives in `out`, headers in `dev`
ffmpeg.pkg-path = "ffmpeg" # Dockerfile FFMPEG_VERSION=9.0.1 (catalog 9.0.1, exact) · video transcoding via kt-paperclip

# --- Native C-extension gem dependencies ---
openssl.pkg-path = "openssl" # Gemfile.lock openssl 4.0.2 + hiredis-client 0.30.1 compile against OpenSSL headers (2026-09-14: bundle install failed "OpenSSL library could not be found" without it)
openssl.outputs = [
  "out",
  "dev",
] # default is bin only; extconf needs libssl (out) + openssl/ssl.h (dev)
icu.pkg-path = "icu" # Gemfile charlock_holmes ~> 0.7.7 links system ICU · Dockerfile libicu76 (catalog 78.3)
icu.outputs = [
  "out",
  "dev",
] # default is out only; charlock_holmes needs ICU headers (dev) to compile
libidn.pkg-path = "libidn" # Gemfile idn-ruby · Aptfile libidn12 · Dockerfile libidn-dev (GNU libidn v1 — NOT libidn2)
libidn.outputs = [
  "out",
  "dev",
] # default is bin only; idn-ruby needs libidn shared lib (out) + headers (dev)

# --- Toolchain to compile native gems (pg, ruby-vips, charlock_holmes, idn-ruby, ...) ---
pkg-config.pkg-path = "pkg-config" # extconf.rb library discovery
gcc.pkg-path = "gcc" # C compiler for gem extensions
gnumake.pkg-path = "gnumake" # make for gem extensions

# --- Runtime CLI tools ---
file.pkg-path = "file" # Dockerfile installs `file`; Paperclip uses it for upload MIME detection (don't rely on the host having it)

[vars]
# Literal strings only — no shell interpolation here.
RAILS_ENV = "development"
# Rails (config/database.yml) and streaming/ both read these:
DB_HOST = "/tmp/mastodon-postgres" # unix-socket directory; postgres listens here (dev-only, trust auth)
DB_PORT = "5432"
DB_USER = "mastodon"
DB_NAME = "mastodon_development"
REDIS_URL = "redis://localhost:6379"

[hook]
on-activate = '''
  # --- Keep Ruby gems inside the env cache, never in the repo tree or ~/.gem ---
  export GEM_HOME="$FLOX_ENV_CACHE/bundle"
  export BUNDLE_PATH="$FLOX_ENV_CACHE/bundle"
  export PATH="$GEM_HOME/bin:$PATH"

  # --- PostgreSQL cluster under the cache; socket dir is $DB_HOST ---
  export PGDATA="$FLOX_ENV_CACHE/postgres"
  mkdir -p "$DB_HOST"
  if [ ! -d "$PGDATA" ]; then
    echo "→ initializing PostgreSQL cluster (one time)" >&2
    initdb -D "$PGDATA" --username="$DB_USER" --auth=trust --no-locale --encoding=UTF8 >/dev/null
  fi

  # --- Redis state under the cache ---
  mkdir -p "$FLOX_ENV_CACHE/redis"

  # --- macOS: SIP strips DYLD_* from anything launched through /usr/bin/env (bin/rails, bin/dev) ---
  # ruby-vips loads libvips via ffi at runtime; ffi's macOS fallback search honors LD_LIBRARY_PATH,
  # which SIP leaves alone. (2026-09-14: without this, `bin/rails db:setup` failed with
  # "Could not open library 'vips.42'" while `bundle exec rails db:setup` worked.)
  case "$(uname -s)" in
    Darwin) export LD_LIBRARY_PATH="$FLOX_ENV/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ;;
  esac

  # --- Ruby deps (Gemfile) — idempotent ---
  bundle check >/dev/null 2>&1 || bundle install

  # --- Yarn: exact packageManager version (yarn@4.18.1) via corepack, kept in the env cache ---
  export COREPACK_HOME="$FLOX_ENV_CACHE/corepack"
  mkdir -p "$COREPACK_HOME" "$FLOX_ENV_CACHE/node-bin"
  corepack enable --install-directory "$FLOX_ENV_CACHE/node-bin" yarn
  export PATH="$FLOX_ENV_CACHE/node-bin:$PATH"

  # --- Node deps: yarn workspaces cover the root app + streaming/ ---
  if [ ! -d node_modules ] || [ yarn.lock -nt node_modules ]; then
    yarn install --immutable
  fi

  echo "Ready. 'flox services start' (or 'flox activate -s') brings up postgres, redis, web, sidekiq, streaming and vite." >&2
  echo "The database is created/migrated automatically on first start (bin/rails db:prepare in the web service)." >&2
'''

[services.postgres]
# Socket-only (TCP disabled so a host Postgres on 5432 can't collide); state under the cache; dev-only trust auth.
command = '''
  exec postgres -D "$FLOX_ENV_CACHE/postgres" -k "$DB_HOST" -p "$DB_PORT" -c listen_addresses=""
'''

[services.redis]
# localhost:6379 (REDIS_URL) plus a project-named unix socket; data under the cache, no persistence.
command = '''
  exec redis-server --port 6379 --unixsocket /tmp/mastodon-redis.sock --dir "$FLOX_ENV_CACHE/redis" --save "" --appendonly no
'''

# --- Application processes, ported from Procfile.dev (what bin/dev hands to foreman/overmind) ---
# Flox services have no dependency ordering, so each app service waits for what it needs.
# web owns database setup: `bin/rails db:prepare` (what bin/setup runs) creates, loads the
# schema and seeds on first start, and only runs pending migrations after that.
# sidekiq and streaming wait until that schema exists before starting.
[services.web]
command = '''
  until pg_isready -h "$DB_HOST" -p "$DB_PORT" -q; do sleep 0.5; done
  until redis-cli -u "$REDIS_URL" ping >/dev/null 2>&1; do sleep 0.5; done
  bundle exec rails db:prepare
  exec bundle exec puma -C config/puma.rb
'''
[services.web.vars]
PORT = "3000"

[services.sidekiq]
command = '''
  until psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT 1 FROM schema_migrations LIMIT 1" >/dev/null 2>&1; do sleep 1; done
  until redis-cli -u "$REDIS_URL" ping >/dev/null 2>&1; do sleep 0.5; done
  exec bundle exec sidekiq
'''

[services.streaming]
command = '''
  until psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT 1 FROM schema_migrations LIMIT 1" >/dev/null 2>&1; do sleep 1; done
  until redis-cli -u "$REDIS_URL" ping >/dev/null 2>&1; do sleep 0.5; done
  exec yarn workspace @mastodon/streaming start
'''
[services.streaming.vars]
PORT = "4000"

[services.vite]
command = '''
  exec yarn dev
'''

[options]
# x86_64-darwin excluded: ruby_4_0@4.0.6, nodejs_24@24.19.0, postgresql_14@14.24, redis,
# vips, ffmpeg, icu, libidn, openssl and gcc all lack an x86_64-darwin build (confirmed via `flox show`),
# so the environment cannot activate on Intel macOS regardless.
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
